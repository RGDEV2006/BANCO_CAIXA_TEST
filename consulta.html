<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta - Sua Loteria</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="container">
<h2 style="margin-bottom:12px;color:#1F4E78">Consulta</h2>

<div class="toolbar"><input id="q" class="input" placeholder="Buscar por loja, concurso, modalidade, data..." style="min-width:260px"><button class="btn" onclick="doSearch()">Buscar</button><button class="btn" onclick="exportConsulta()">Exportar CSV</button></div>
<div class="card"><div class="table-wrap"><table id="tblConsulta"><thead><tr><th>Data</th><th>Loja</th><th>Origem</th><th>Bolão</th><th>Concurso</th><th>Data Sorteio</th><th>Prêmio</th><th>Enviadas</th><th>Vendidas</th><th>Prejuízo</th></tr></thead><tbody></tbody></table></div></div>

</div>
<div id="modalRoot"></div>
<script src="js/app.js"></script>
<script>
const SESSION=requireAuth(); if(SESSION){ renderTopbar('consulta'); }

let {boloes,registros}=getData();
let filtered=registros;
function doSearch(){
  const q=document.getElementById('q').value.toLowerCase();
  filtered=registros.filter(r=>{
    const b=boloes.find(x=>x.id===r.bolao_id);
    const txt=`${r.data} ${r.loja} ${r.origem_fornecedor} ${r.concurso} ${r.data_sorteio} ${b?.modalidade||''}`.toLowerCase();
    return txt.includes(q);
  });
  renderConsulta();
}
function renderConsulta(){
  const tb=document.querySelector('#tblConsulta tbody');
  tb.innerHTML=filtered.map(r=>{
    const b=boloes.find(x=>x.id===r.bolao_id);
    return `<tr><td>${r.data}</td><td>${r.loja}</td><td>${r.origem_fornecedor}</td><td>${b?.modalidade||''}</td><td>${r.concurso}</td><td>${r.data_sorteio}</td><td>${fmtBRL(r.premio_estimado)}</td><td>${r.enviadas}</td><td>${r.vendidas}</td><td class="${calcPrejuizo(r,b)>0?'text-red':''}">${fmtBRL(calcPrejuizo(r,b))}</td></tr>`;
  }).join('');
}
function exportConsulta(){exportCSV(filtered,'consulta.csv')}
renderConsulta();

</script>
</body>
</html>
